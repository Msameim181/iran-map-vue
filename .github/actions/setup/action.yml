name: Set up iran-map-vue
description: Node 22 with the GitHub Packages registry for the @msameim181 scope, then npm ci.

# The calling job must set NODE_AUTH_TOKEN (secrets.GITHUB_TOKEN) and `permissions: packages: read`.
# GitHub Packages requires a token even to install public packages.
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        registry-url: https://npm.pkg.github.com
        scope: '@msameim181'
    - name: Install dependencies
      shell: bash
      run: npm ci
