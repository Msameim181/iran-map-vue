name: Release

on:
  push:
    tags: ['v*']
  # Dry run: the same verify and smoke jobs, then `npm publish --dry-run` against both registries.
  # Never publishes or releases (those jobs only run for a tag push); run it on a branch with
  # `gh workflow run release.yml --ref <branch>` before merging workflow or action changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read-only: builds, tests and packs exactly what the publish jobs will upload.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main and match package.json (dry runs only read the version)
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag ${GITHUB_REF_NAME} is not on main."; exit 1; }
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $version."; exit 1; }
          else
            echo "Dry run on ${GITHUB_REF_NAME} (package.json $version): tag checks skipped, nothing will be published."
          fi
          if grep -q '"file:' package.json; then echo "::error::package.json has a file: dependency."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package checks (publint, are-the-types-wrong)
        run: npm run check:package
      - name: Smoke test the packed package
        run: npm run smoke
      - name: Bundle size budgets
        run: npm run size -- --check
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --silent --pack-destination "$RUNNER_TEMP/pack"
      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  smoke-node:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['18', '20']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci --ignore-scripts
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Smoke test
        run: |
          tarball="$(ls "$RUNNER_TEMP"/tarball/*.tgz)"
          export IRAN_MAP_VUE_TARBALL="$tarball"
          node scripts/smoke.mjs --no-vite

  publish-github:
    needs: [verify, smoke-node]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Publish to GitHub Packages (skipped when this version already exists)
        run: |
          set -euo pipefail
          if npm view "@msameim181/iran-map-vue@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version $VERSION is already on GitHub Packages; nothing to do."
            exit 0
          fi
          tag=latest; [ "$PRERELEASE" = "true" ] && tag=next
          npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --registry https://npm.pkg.github.com --tag "$tag"

  # npmjs.org via trusted publishing (OIDC): no token. Skipped until the repository variable
  # NPM_PUBLISH is 'true' (set after configuring the trusted publisher for this package on npmjs).
  publish-npm:
    needs: [verify, smoke-node]
    if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Exact version: this job holds id-token: write. Trusted publishing needs npm >= 11.5.1.
      - name: Use a pinned npm with trusted publishing support
        run: npm install -g npm@11.21.0
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Publish to npmjs.org (skipped when this version already exists)
        run: |
          set -euo pipefail
          if npm view "@msameim181/iran-map-vue@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version $VERSION is already on npmjs.org; nothing to do."
            exit 0
          fi
          tag=latest; [ "$PRERELEASE" = "true" ] && tag=next
          npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --registry https://registry.npmjs.org --access public --provenance --tag "$tag"

  github-release:
    needs: [verify, publish-github]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release from the changelog (skipped when it exists)
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          flags=(); [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  # Dry run only (workflow_dispatch): same actions and setup as publish-npm, ending in a dry-run
  # publish. Read-only token, no id-token, no provenance. `npm view` is run as the real job does, so
  # an .npmrc / NODE_AUTH_TOKEN problem in setup-node shows up here; only a 404 is acceptable.
  dry-run-publish-npm:
    needs: [verify, smoke-node]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use a pinned npm with trusted publishing support
        run: npm install -g npm@11.21.0
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Registry lookup and dry-run publish to npmjs.org
        run: |
          set -euo pipefail
          rc=0; out="$(npm view "@msameim181/iran-map-vue@$VERSION" version --registry https://registry.npmjs.org 2>&1)" || rc=$?
          echo "npm view exit $rc: $out"
          if [ "$rc" -ne 0 ] && ! grep -q E404 <<<"$out"; then echo "::error::npm view failed for a reason other than 404."; exit 1; fi
          pub=0; pubout="$(npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --dry-run --access public --registry https://registry.npmjs.org --tag next 2>&1)" || pub=$?
          echo "$pubout"
          if [ "$pub" -ne 0 ]; then
            # An already-published version is the case the real job skips; npm still reports it under --dry-run.
            if [ "$rc" -eq 0 ] && grep -q 'previously published version' <<<"$pubout"; then echo "Version $VERSION already exists: the real job would skip publishing."; else exit "$pub"; fi
          fi

  # Dry run only: mirrors publish-github (NODE_AUTH_TOKEN from GITHUB_TOKEN) with read-only packages access.
  dry-run-publish-github:
    needs: [verify, smoke-node]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Registry lookup and dry-run publish to GitHub Packages
        run: |
          set -euo pipefail
          rc=0; out="$(npm view "@msameim181/iran-map-vue@$VERSION" version --registry https://npm.pkg.github.com 2>&1)" || rc=$?
          echo "npm view exit $rc: $out"
          if [ "$rc" -ne 0 ] && ! grep -q E404 <<<"$out"; then echo "::error::npm view failed for a reason other than 404."; exit 1; fi
          pub=0; pubout="$(npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --dry-run --registry https://npm.pkg.github.com --tag next 2>&1)" || pub=$?
          echo "$pubout"
          if [ "$pub" -ne 0 ]; then
            # An already-published version is the case the real job skips; npm still reports it under --dry-run.
            if [ "$rc" -eq 0 ] && grep -q 'previously published version' <<<"$pubout"; then echo "Version $VERSION already exists: the real job would skip publishing."; else exit "$pub"; fi
          fi
