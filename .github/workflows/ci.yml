name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build library
        run: npm run build
      - name: Package checks (publint, are-the-types-wrong)
        run: npm run check:package
      - name: Smoke test the packed package (Node, Vite SSR, renderToString)
        run: npm run smoke
      - name: Bundle size budgets (packed package)
        run: npm run size -- --check
      - name: Build demo
        run: npm run demo:build
      - name: Pack tarball for the Node matrix
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --silent --pack-destination "$RUNNER_TEMP/pack"
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # Loads the tarball built above on every supported Node. Vite needs Node 20.19+/22.12+, so the
  # Vite SSR check only runs on 22.
  node-matrix:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install (for the vue and core symlinks the smoke test reuses)
        run: npm ci --ignore-scripts
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      - name: Smoke test
        env:
          NODE_MATRIX: ${{ matrix.node }}
        run: |
          tarball="$(ls "$RUNNER_TEMP"/tarball/*.tgz)"
          export IRAN_MAP_VUE_TARBALL="$tarball"
          if [ "$NODE_MATRIX" = "22" ]; then node scripts/smoke.mjs; else node scripts/smoke.mjs --no-vite; fi

  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Pinned release binary verified against its published SHA-256 (no piped remote script);
      # also checks release.yml, which only runs on v* tags.
      - name: Lint workflows
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
