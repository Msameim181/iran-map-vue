name: Deploy demo to GitHub Pages

# Manual only for now. To deploy on every push, add:
#   push:
#     branches: [main]
# (after Pages is enabled with the "GitHub Actions" source in repository settings).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build demo
        run: npm run demo:build -- --base /iran-map-vue/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
